<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#eceee5"><meta name="description" content="牢廖 ↔ 廖佬 ↔ 廖吊 ↔ 廖圣，拖动头像，手动变廖。"><title>滑动变廖器</title>
<style>
@font-face{font-family:localChinese;src:local('Noto Sans CJK SC')}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eceee5}body{transition:background .6s;font-family:localChinese,'Microsoft Yahei',sans-serif}#stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;outline:none}#stage.grabbable{cursor:grab}#stage.dragging{cursor:grabbing}#fallback{display:none;position:absolute;left:10%;right:10%;top:50%;transform:translateY(-50%);padding:24px;background:#e6ddbb;border:6px solid #a88c4e;border-radius:40px;text-align:center;box-shadow:0 16px 0 #a46c3d}#fallback img{display:block;width:100px;height:100px;object-fit:cover;border-radius:50%;margin:-80px auto 16px;border:6px solid #b99b55}#fallback label{display:block;font-size:28px;font-weight:bold}#fallback input{width:100%;accent-color:#9c7336;margin-top:16px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
</style></head><body>
<main id="stage" role="slider" tabindex="0" aria-label="滑动变廖器。按住头像左右拖动；键盘左右键也可调节。" aria-valuemin="0" aria-valuemax="100" aria-valuenow="33" aria-valuetext="廖佬"><div id="fallback"><img id="fallback-face" alt="廖的表情"><label id="fallback-title" for="fallback-slider">廖佬</label><input id="fallback-slider" type="range" min="0" max="1000" value="333" aria-label="拖动变廖"></div></main>
<script>/*__THREE__*/</script>
<script>
'use strict';
const ATLAS='__ATLAS__';
const modes=[{name:'牢廖',paper:'#e7ebe8'},{name:'廖佬',paper:'#eceee5'},{name:'廖吊',paper:'#eee8dd'},{name:'廖圣',paper:'#f0eddf'}];
const stage=document.querySelector('#stage'),$=s=>document.querySelector(s);
let target=1/3,current=1/3,mode=1,scene,camera,renderer,machine,coin,faceTexture,faceCtx,atlasImg,halo,bars,glasses,dragging=false,hasWebGL=false,lastFrame=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function setValue(v){target=Math.max(0,Math.min(1,v));stage.setAttribute('aria-valuenow',Math.round(target*100));const next=Math.round(target*3);if(mode!==next){mode=next;stage.setAttribute('aria-valuetext',modes[mode].name);document.body.style.background=modes[mode].paper;$('#fallback-title').textContent=modes[mode].name;drawFace()}}
function faceCanvas(index,size=512){const c=document.createElement('canvas');c.width=c.height=size;const ctx=c.getContext('2d');if(atlasImg?.naturalWidth){const w=atlasImg.naturalWidth/2,h=atlasImg.naturalHeight/2;ctx.drawImage(atlasImg,(index%2)*w,Math.floor(index/2)*h,w,h,0,0,size,size)}return c}
function drawFace(){if(!atlasImg?.naturalWidth)return;const c=faceCanvas(mode);if(faceCtx){faceCtx.clearRect(0,0,512,512);faceCtx.drawImage(c,0,0);faceTexture.needsUpdate=true}$('#fallback-face').src=c.toDataURL()}
function mat(color,metalness=0,roughness=.5){return new THREE.MeshStandardMaterial({color,metalness,roughness})}
function mesh(geo,material,parent=machine){const m=new THREE.Mesh(geo,material);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function box(w,h,d,material,x,y,z,parent=machine){const m=mesh(new THREE.BoxGeometry(w,h,d),material,parent);m.position.set(x,y,z);return m}
function cylinder(r,len,material,x,y,z,parent=machine){const m=mesh(new THREE.CylinderGeometry(r,r,len,64),material,parent);m.rotation.z=Math.PI/2;m.position.set(x,y,z);return m}
function tube(r,len,material,x,y,z,parent=machine){const m=mesh(new THREE.CylinderGeometry(r,r,len,32),material,parent);m.position.set(x,y,z);return m}
function roundedBox(w,h,d,r,material,x,y,z,parent=machine){const s=new THREE.Shape(),a=-w/2,b=-d/2;s.moveTo(a+r,b);s.lineTo(a+w-r,b);s.quadraticCurveTo(a+w,b,a+w,b+r);s.lineTo(a+w,b+d-r);s.quadraticCurveTo(a+w,b+d,a+w-r,b+d);s.lineTo(a+r,b+d);s.quadraticCurveTo(a,b+d,a,b+d-r);s.lineTo(a,b+r);s.quadraticCurveTo(a,b,a+r,b);const geo=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:.045,bevelThickness:.045});geo.rotateX(-Math.PI/2);geo.translate(0,-h/2,0);const m=mesh(geo,material,parent);m.position.set(x,y,z);return m}
function woodTexture(){const c=document.createElement('canvas');c.width=1024;c.height=256;const x=c.getContext('2d');x.fillStyle='#9e6135';x.fillRect(0,0,1024,256);let seed=71;const rand=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};for(let i=0;i<2400;i++){const y=rand()*256;x.strokeStyle=rand()>.5?'rgba(54,29,12,.1)':'rgba(242,188,119,.13)';x.lineWidth=rand()*2;x.beginPath();x.moveTo(0,y);for(let a=0;a<=1024;a+=50)x.lineTo(a,y+Math.sin(a/180+i)*rand()*6);x.stroke()}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function dialTexture(){const c=document.createElement('canvas');c.width=2048;c.height=512;const x=c.getContext('2d');x.fillStyle='#ece5cd';x.fillRect(0,0,2048,512);x.fillStyle='#384333';x.strokeStyle='#596048';for(let i=0;i<=90;i++){const a=100+i*20.53;x.lineWidth=i%10===0?4:2;x.beginPath();x.moveTo(a,30);x.lineTo(a,i%10===0?70:49);x.stroke();x.beginPath();x.moveTo(a,490);x.lineTo(a,i%10===0?460:473);x.stroke()}x.textAlign='center';for(let i=0;i<4;i++){x.font='bold 73px localChinese, sans-serif';x.fillText(modes[i].name,265+i*506,174);x.font='20px monospace';x.fillStyle='#8c9175';x.fillText('0'+(i+1),265+i*506,213);x.fillStyle='#384333'}x.font='900 130px localChinese, sans-serif';x.fillText('滑动变廖器',1024,380);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function curvedDial(){const geo=new THREE.PlaneGeometry(7.6,1.36,1,48),p=geo.attributes.position;for(let i=0;i<p.count;i++){const v=p.getY(i)/.68*.96;p.setY(i,Math.sin(v)*.79);p.setZ(i,Math.cos(v)*.79+.009)}geo.computeVertexNormals();mesh(geo,new THREE.MeshStandardMaterial({map:dialTexture(),roughness:1}),machine).position.y=.16}
function makeScene(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(36,1,.1,100);camera.position.set(4.5,4.3,13.9);camera.lookAt(0,-.13,0);renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0,0);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.domElement.setAttribute('aria-hidden','true');stage.prepend(renderer.domElement);hasWebGL=true;
scene.add(new THREE.HemisphereLight(0xfff9dd,0x6d785d,2.1));const key=new THREE.DirectionalLight(0xfff1cb,2.8);key.position.set(-3,8,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-8;key.shadow.camera.right=8;key.shadow.camera.top=6;key.shadow.camera.bottom=-6;key.shadow.normalBias=.025;scene.add(key);const rim=new THREE.DirectionalLight(0xe6f0ff,2);rim.position.set(5,3,-5);scene.add(rim);
machine=new THREE.Group();scene.add(machine);const brass=mat(0xb89a55,.78,.27),gold=mat(0xd2b97b,.72,.23),dark=mat(0x4a4d3c,.55,.38),ivory=mat(0xece5cd,0,.65),red=mat(0x822e20,.36,.35),wood=new THREE.MeshStandardMaterial({map:woodTexture(),roughness:.52});
roundedBox(10,.28,3.5,.25,wood,0,-1.4,0);roundedBox(9.7,.12,3.25,.2,wood,0,-1.62,0);for(const x of[-4.25,4.25]){roundedBox(1.05,.15,2.4,.22,brass,x,-1.16,0);for(const z of[-.9,.9]){tube(.14,.08,dark,x,-1.02,z);tube(.095,.045,gold,x,-.96,z)}tube(.17,1.65,brass,x,-.32,0);tube(.27,.11,gold,x,.53,0);const ball=mesh(new THREE.SphereGeometry(.22,24,24),gold);ball.position.set(x,.58,0)}
cylinder(.78,7.7,ivory,0,.16,0);curvedDial();for(const x of[-3.92,3.92]){cylinder(.83,.13,gold,x,.16,0);cylinder(.7,.12,brass,x*1.025,.16,0);cylinder(.23,.42,brass,x*1.085,.16,0);cylinder(.29,.12,dark,x*1.145,.16,0)}cylinder(.065,8.55,brass,0,1.0,-.12);cylinder(.055,8.55,brass,0,-.78,.4);for(const x of[-4.25,4.25]){tube(.18,.2,brass,x,-.99,1.04);tube(.12,.2,red,x,-.8,1.04);tube(.07,.03,dark,x,-.68,1.04)}
// The sliding portrait is a raised medallion on a real brass rail.
coin=new THREE.Group();machine.add(coin);coin.position.set(-1.02,1.22,.62);coin.scale.setScalar(1.5);const back=mesh(new THREE.CylinderGeometry(.57,.57,.16,64),dark,coin);back.rotation.x=Math.PI/2;const rimMesh=mesh(new THREE.TorusGeometry(.514,.055,12,80),gold,coin);rimMesh.position.z=.1;
const fc=document.createElement('canvas');fc.width=fc.height=512;faceCtx=fc.getContext('2d');faceTexture=new THREE.CanvasTexture(fc);faceTexture.colorSpace=THREE.SRGBColorSpace;const portrait=mesh(new THREE.CircleGeometry(.49,80),new THREE.MeshBasicMaterial({map:faceTexture}),coin);portrait.position.z=.111;
const needle=mesh(new THREE.ConeGeometry(.095,.36,3),dark,coin);needle.rotation.z=Math.PI;needle.position.set(0,-.7,.07);box(.11,.37,.16,brass,0,-.53,-.1,coin);
halo=new THREE.Group();coin.add(halo);const h=mesh(new THREE.TorusGeometry(.48,.035,10,64),new THREE.MeshStandardMaterial({color:0xffd16c,emissive:0xc29026,emissiveIntensity:.65,metalness:.5,roughness:.3}),halo);h.rotation.x=1.2;h.position.set(0,.76,.06);for(let i=0;i<12;i++){const a=i/12*Math.PI*2;const r=box(.025,.17,.025,gold,Math.cos(a)*.67,Math.sin(a)*.67,.06,halo);r.rotation.z=a-Math.PI/2}
bars=new THREE.Group();coin.add(bars);for(let i=-2;i<=2;i++)box(.035,.91,.04,dark,i*.18,0,.15,bars);box(1.02,.035,.04,dark,0,.27,.16,bars);box(1.02,.035,.04,dark,0,-.24,.16,bars);
glasses=new THREE.Group();coin.add(glasses);const black=mat(0x161f1b,.2,.25);for(const x of[-.2,.2]){box(.35,.15,.04,black,x,.05,.18,glasses);box(.29,.018,.045,gold,x,.115,.205,glasses)}box(.1,.035,.045,black,0,.075,.18,glasses);glasses.rotation.z=-.1;
const ground=mesh(new THREE.PlaneGeometry(200,200),new THREE.ShadowMaterial({opacity:.18}),scene);ground.rotation.x=-Math.PI/2;ground.position.y=-1.76;resize();new ResizeObserver(resize).observe(stage);drawFace();}
function resize(){if(!renderer)return;const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;const distance=Math.max(12.8,17.6/camera.aspect);camera.zoom=1;camera.position.set(distance*.25,distance*.25,distance);camera.lookAt(0,.1,0);camera.updateProjectionMatrix()}

const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),dragPlane=new THREE.Plane(new THREE.Vector3(0,0,1),-.62),intersection=new THREE.Vector3();
let dragOffset=0;
function cast(e){const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera)}
function pointerX(e){cast(e);if(raycaster.ray.intersectPlane(dragPlane,intersection))return intersection.x;return coin.position.x}
function overHandle(e){cast(e);return raycaster.intersectObject(coin,true).length>0}
// Only the portrait handle starts a drag. Clicking the dial never changes value.
stage.addEventListener('pointerdown',e=>{if(!hasWebGL||!overHandle(e))return;e.preventDefault();dragging=true;dragOffset=pointerX(e)-coin.position.x;stage.setPointerCapture(e.pointerId);stage.classList.add('dragging')});
stage.addEventListener('pointermove',e=>{if(!hasWebGL)return;if(dragging){e.preventDefault();setValue((pointerX(e)-dragOffset+3.05)/6.1)}else stage.classList.toggle('grabbable',overHandle(e))});
function release(e){if(!dragging)return;dragging=false;stage.classList.remove('dragging');if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId)}
stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);stage.addEventListener('lostpointercapture',()=>{dragging=false;stage.classList.remove('dragging')});
stage.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();setValue(target+(e.code==='ArrowRight'?.025:-.025))}});$('#fallback-slider').addEventListener('input',e=>setValue(+e.target.value/1000));
function animate(t){requestAnimationFrame(animate);if(document.hidden){lastFrame=t;return}const dt=Math.min((t-lastFrame)/1000,.05);lastFrame=t;current+=(target-current)*(reduced||dragging?1:1-Math.exp(-dt*18));if(renderer&&hasWebGL){coin.position.x=-3.05+current*6.1;coin.position.y=1.22;coin.rotation.z=(target-current)*-.35;halo.visible=mode===3;bars.visible=mode===0;glasses.visible=mode===2;if(halo.visible&&!reduced)halo.rotation.z=Math.sin(t/1600)*.04;renderer.render(scene,camera)}}
atlasImg=new Image();atlasImg.onload=drawFace;atlasImg.src=ATLAS;
try{makeScene()}catch(e){console.warn('3D unavailable',e);hasWebGL=false;if(renderer)renderer.domElement.remove();$('#fallback').style.display='block';drawFace()}
document.addEventListener('visibilitychange',()=>{lastFrame=performance.now()});requestAnimationFrame(animate);
</script></body></html>
